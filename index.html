<title>VeriTrip — Travel Expenses</title>
<style>
:root{
  --bg:#f2f2f7; --bg2:#ffffff; --card:#ffffff; --card2:#f2f2f7; --elev:#ffffff;
  --label:#000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.34);
  --sep:rgba(60,60,67,.18); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --indigo:#5856d6; --purple:#af52de;
  --pink:#ff2d55; --teal:#30b0c7; --cyan:#32ade6; --yellow:#ffcc00; --mint:#00c7be; --brown:#a2845e; --gray:#8e8e93;
  --bar:rgba(249,249,249,.82); --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 18px rgba(0,0,0,.05);
  --radius:14px; --tabh:56px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#000; --bg2:#1c1c1e; --card:#1c1c1e; --card2:#2c2c2e; --elev:#2c2c2e;
    --label:#fff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
    --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --indigo:#5e5ce6; --purple:#bf5af2;
    --pink:#ff375f; --teal:#40c8e0; --cyan:#64d2ff; --yellow:#ffd60a; --mint:#63e6e2; --brown:#ac8e68;
    --bar:rgba(22,22,24,.78); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#000; --bg2:#1c1c1e; --card:#1c1c1e; --card2:#2c2c2e; --elev:#2c2c2e;
  --label:#fff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --indigo:#5e5ce6; --purple:#bf5af2;
  --pink:#ff375f; --teal:#40c8e0; --cyan:#64d2ff; --yellow:#ffd60a; --mint:#63e6e2; --brown:#ac8e68;
  --bar:rgba(22,22,24,.78); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  background:var(--bg);color:var(--label);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:17px;height:17px} svg.i.l{width:28px;height:28px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--label2)} .faint{color:var(--label3)} .small{font-size:13px} .foot{font-size:13px;color:var(--label2);padding:7px 16px 0;line-height:1.35}
.hidden{display:none!important}

/* ---------- Layout ---------- */
#app{max-width:760px;margin:0 auto;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 24px)}
.view{display:none;padding:0 16px;animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}
.navbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:center;justify-content:space-between;min-height:44px;transition:background .2s,border-color .2s;border-bottom:.5px solid transparent}
.navbar.scrolled{background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.navbar .mini{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.navbar.scrolled .mini{opacity:1}
.navbtn{color:var(--blue);font-size:17px;display:inline-flex;align-items:center;gap:2px;min-height:36px;padding:0 2px}
.navbtn.circle{width:34px;height:34px;border-radius:50%;background:var(--fill);justify-content:center}
.navbtn.circle svg{width:20px;height:20px}
.ltitle{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.15;margin:2px 0 4px}
.lsub{color:var(--label2);font-size:15px;margin-bottom:18px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 8px}
.section-h h2{font-size:22px;font-weight:700;margin:0;letter-spacing:.005em}
.section-h a,.section-h button{color:var(--blue);font-size:15px}
.ghead{font-size:13px;text-transform:uppercase;color:var(--label2);letter-spacing:.02em;margin:24px 16px 7px}

/* ---------- Cards & lists ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.pad{padding:16px}
.group{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:48px;position:relative;width:100%;text-align:left;background:var(--card)}
.row.tap:active{background:var(--fill)}
.row+.row::before,.row+.rowwrap::before,.rowwrap+.row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
.row.has-icon{--inset:60px}
.row .body{flex:1;min-width:0;padding:11px 0}
.row .t{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font-size:14px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{color:var(--label2);text-align:right;white-space:nowrap}
.row .amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .amt .sub{display:block;font-size:13px;color:var(--label2);margin-top:2px}
.chev{color:var(--label3)}
.ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:19px;height:19px;stroke-width:2}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--fill);color:var(--label2);white-space:nowrap}
.pill.company{background:color-mix(in srgb,var(--indigo) 15%,transparent);color:var(--indigo)}
.pill.warn{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.pill.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.red{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.empty{text-align:center;color:var(--label2);padding:34px 20px;font-size:15px}
.empty svg{width:44px;height:44px;color:var(--label3);margin:0 auto 10px;display:block;stroke-width:1.5}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:12px;padding:0 18px;font-weight:600;font-size:17px;background:var(--blue);color:#fff;width:100%;transition:opacity .15s,transform .1s}
.btn:active{opacity:.75;transform:scale(.99)}
.btn.tinted{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.danger{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.btn.sm{min-height:36px;font-size:15px;border-radius:99px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.4}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.quick button{background:var(--card);border-radius:14px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500;box-shadow:var(--shadow)}
.quick button:active{background:var(--fill)}
.quick .ico{width:40px;height:40px;border-radius:12px}
.quick .ico svg{width:22px;height:22px}
.linkbtn{color:var(--blue);font-size:15px}

/* ---------- Hero (active trip) ---------- */
.hero{border-radius:20px;padding:18px 18px 16px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c1,#0a84ff),var(--c2,#5e5ce6))}
.hero .k{font-size:13px;font-weight:600;opacity:.85;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.hero .city{font-size:28px;font-weight:700;margin:6px 0 2px;letter-spacing:.005em}
.hero .dates{font-size:15px;opacity:.9}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hero .stat{background:rgba(255,255,255,.18);border-radius:12px;padding:9px 10px;backdrop-filter:blur(10px)}
.hero .stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .stat span{font-size:12px;opacity:.85}
.hero .progress{height:4px;border-radius:4px;background:rgba(255,255,255,.25);margin-top:14px;overflow:hidden}
.hero .progress i{display:block;height:100%;background:#fff;border-radius:4px}
.hero.idle{background:var(--card);color:var(--label);box-shadow:var(--shadow)}
.hero.idle .k{color:var(--label2)}

/* ---------- Segmented control ---------- */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;position:relative}
.seg button{flex:1;border-radius:7px;padding:6px 8px;font-size:13px;font-weight:600;color:var(--label);min-height:30px;transition:background .2s}
.seg button.on{background:var(--elev);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme=dark] .seg button.on{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .seg button.on{background:#636366}}

/* ---------- Search ---------- */
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px;color:var(--label2);margin-bottom:10px}
.search input{border:0;background:transparent;outline:none;flex:1;font-size:17px;color:var(--label);min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:99px;background:var(--card);font-size:15px;box-shadow:var(--shadow)}
.chip.on{background:var(--label);color:var(--bg)}

/* ---------- Tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 4px calc(env(safe-area-inset-bottom) + 4px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--gray);padding:2px 0;max-width:110px}
.tabbar button svg{width:25px;height:25px;stroke-width:1.8}
.tabbar button.on{color:var(--blue)}
.tabbar button.on svg{stroke-width:2.2}
.badge{position:absolute;top:-2px;right:-8px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.tabbar .bwrap{position:relative}
@media (min-width:980px){
  .tabbar{top:0;right:auto;width:230px;flex-direction:column;justify-content:flex-start;gap:2px;padding:calc(env(safe-area-inset-top) + 64px) 12px 12px;border-top:0;border-right:.5px solid var(--sep)}
  .tabbar::before{content:"VeriTrip";position:absolute;top:22px;left:22px;font-weight:700;font-size:22px;color:var(--label)}
  .tabbar button{flex:none;flex-direction:row;gap:12px;font-size:15px;max-width:none;padding:9px 12px;border-radius:10px;color:var(--label)}
  .tabbar button svg{width:21px;height:21px;color:var(--blue)}
  .tabbar button.on{background:var(--fill)}
  .tabbar button .badge{position:static;margin-left:auto}
  #app{padding-left:230px;max-width:1000px;padding-bottom:40px}
  .view{padding:0 32px}
  .navbar{margin:0 -32px;padding-left:32px;padding-right:32px}
}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.cal-head .m{font-size:22px;font-weight:700}
.cal-head .m span{color:var(--red)}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--label2);text-align:center;font-weight:600;padding:6px 0;text-transform:uppercase}
.cal-grid{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);touch-action:pan-y}
.week{display:grid;grid-template-columns:repeat(7,1fr);position:relative;min-height:74px;border-top:.5px solid var(--sep)}
.week:first-child{border-top:0}
.day{position:relative;padding:5px 0 0;display:flex;flex-direction:column;align-items:center;min-height:74px;cursor:pointer}
.day:active{background:var(--fill)}
.day .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.day.out .n{color:var(--label3)}
.day.wknd .n{color:var(--label2)}
.day.today .n{background:var(--red);color:#fff;font-weight:600}
.day.sel .n{background:var(--label);color:var(--bg);font-weight:600}
.day.today.sel .n{background:var(--red);color:#fff}
.day .marks{position:absolute;bottom:5px;display:flex;gap:3px;align-items:center}
.day .marks i{width:5px;height:5px;border-radius:50%;background:var(--label3)}
.day .marks i.exp{background:var(--label2)}
.day .marks i.miss{background:var(--orange);width:6px;height:6px}
.bar{position:absolute;height:15px;border-radius:0;font-size:10.5px;font-weight:600;color:#fff;padding:0 5px;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.bar.s{border-top-left-radius:5px;border-bottom-left-radius:5px;margin-left:3px}
.bar.e{border-top-right-radius:5px;border-bottom-right-radius:5px;margin-right:3px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--label2);margin:10px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* ---------- Sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-radius:14px 14px 0 0;max-height:94vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.32,.72,0,1);box-shadow:0 -10px 40px rgba(0,0,0,.18);max-width:680px;margin:0 auto}
.sheet.show{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:6px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px;gap:8px;min-height:50px}
.sheet-h .tt{font-weight:600;font-size:17px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-h .navbtn{min-width:64px}
.sheet-h .navbtn.r{justify-content:flex-end;font-weight:600}
.sheet-b{overflow-y:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@media (min-width:700px){
  .sheet{top:50%;bottom:auto;left:50%;right:auto;width:640px;border-radius:16px;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .25s,opacity .2s;pointer-events:none;max-height:88vh}
  .sheet.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .grab{display:none}
}

/* ---------- Forms ---------- */
.field{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;position:relative;background:var(--card)}
.field+.field::before,.field+.rowwrap::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.field label{flex:none;width:118px;font-size:17px;color:var(--label)}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:17px;text-align:right;color:var(--label);padding:12px 0;appearance:none;-webkit-appearance:none}
.field select{direction:rtl;cursor:pointer;color:var(--label2)}
.field select option{direction:ltr}
.field textarea{text-align:left;resize:none;min-height:70px}
.field.stack{flex-direction:column;align-items:stretch;gap:0}
.field.stack label{width:auto;font-size:13px;color:var(--label2);padding-top:10px}
.field.stack input,.field.stack textarea{text-align:left;padding-top:4px}
.field input[type=date]{min-height:24px}
.field .cf{position:absolute;right:6px;top:4px;font-size:10px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.field.c-low{background:color-mix(in srgb,var(--orange) 10%,var(--card))}
.field.c-low::after,.field.c-none::after{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--orange)}
.field.c-none{background:color-mix(in srgb,var(--red) 8%,var(--card))}
.field.c-none::after{background:var(--red)}
.field.c-high::after{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--green);opacity:.8}
.amount-hero{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px 16px 6px;position:relative}
.amount-hero input{font-size:44px;font-weight:700;border:0;outline:none;background:transparent;text-align:right;width:62%;min-width:0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.amount-hero select{font-size:22px;font-weight:600;border:0;background:var(--fill);border-radius:10px;padding:6px 8px;outline:none;appearance:none;-webkit-appearance:none;color:var(--label)}
.conv{text-align:center;color:var(--label2);font-size:15px;padding-bottom:14px}
.preview{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border-radius:12px;margin-bottom:6px}
.preview img{width:64px;height:84px;object-fit:cover;border-radius:8px;background:var(--fill);cursor:zoom-in;flex:none}
.preview .meta{flex:1;min-width:0;font-size:14px}
.legend-conf{display:flex;gap:12px;font-size:12px;color:var(--label2);margin:8px 4px}
.legend-conf i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
details.raw{margin-top:10px;background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px}
details.raw summary{color:var(--blue);cursor:pointer}
details.raw pre{white-space:pre-wrap;font-size:12px;max-height:220px;overflow:auto;color:var(--label2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--fill2);border-radius:31px;transition:.2s}
.switch span::before{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::before{transform:translateX(20px)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.35;margin:10px 0;background:color-mix(in srgb,var(--blue) 10%,var(--card))}
.notice.warn{background:color-mix(in srgb,var(--orange) 13%,var(--card))}
.notice svg{flex:none;margin-top:1px}
.notice.warn svg{color:var(--orange)}
.notice:not(.warn) svg{color:var(--blue)}

/* ---------- Progress / spinner ---------- */
.proc{display:flex;flex-direction:column;align-items:center;padding:40px 20px 50px;gap:14px;text-align:center}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--fill2);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pbar{width:220px;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-140%);z-index:90;background:var(--elev);color:var(--label);padding:11px 18px;border-radius:99px;box-shadow:0 8px 30px rgba(0,0,0,.18);font-size:15px;font-weight:500;transition:transform .35s cubic-bezier(.32,.72,0,1);max-width:92vw;display:flex;gap:8px;align-items:center}
#toast.show{transform:translate(-50%,0)}
#toast svg{color:var(--green)}

/* ---------- Image viewer ---------- */
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:95;display:none;align-items:center;justify-content:center;padding:20px}
#viewer.show{display:flex}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
#viewer iframe{width:100%;height:100%;border:0;background:#fff;border-radius:8px}
#viewer .x{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center}

/* ---------- Stats tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.tile .k{font-size:13px;color:var(--label2);display:flex;align-items:center;gap:6px}
.tile .v{font-size:24px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:13px;color:var(--label2);margin-top:2px}
.tile.big{grid-column:1/-1}
.tile.big .v{font-size:34px}
.catbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 4px;background:var(--fill)}
.catbar i{display:block;height:100%}

/* ---------- Trip detail header ---------- */
.trip-head{display:flex;gap:6px;flex-wrap:wrap;margin:-8px 0 14px}
.color-pick{display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap;background:var(--card)}
.color-pick button{width:28px;height:28px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--sep)}
.color-pick button.on{border-color:var(--card);box-shadow:0 0 0 2px var(--label)}
.cand{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;background:var(--card);position:relative}
.cand+.cand::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:.5px solid var(--sep)}
.cand input{width:22px;height:22px;margin-top:2px;accent-color:var(--blue)}

/* ---------- Print ---------- */
#print-root{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important;color:#000!important;font-size:11pt}
  body.printing #app,body.printing .tabbar,body.printing .sheet,body.printing .backdrop,body.printing #toast{display:none!important}
  body.printing #print-root{display:block}
  #print-root{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#000}
  #print-root h1{font-size:20pt;margin:0 0 2pt}
  #print-root .sub{color:#555;margin-bottom:12pt}
  #print-root table{width:100%;border-collapse:collapse;font-size:9.5pt;margin:6pt 0 12pt}
  #print-root th{text-align:left;border-bottom:1.2pt solid #000;padding:4pt 4pt;font-size:8.5pt;text-transform:uppercase;color:#333}
  #print-root td{border-bottom:.5pt solid #ccc;padding:4pt 4pt;vertical-align:top}
  #print-root td.r,#print-root th.r{text-align:right;white-space:nowrap}
  #print-root tfoot td{font-weight:700;border-top:1.2pt solid #000;border-bottom:0}
  #print-root .meta{display:grid;grid-template-columns:1fr 1fr;gap:4pt 18pt;font-size:10pt;margin-bottom:12pt}
  #print-root .meta b{display:inline-block;min-width:90pt;color:#555;font-weight:500}
  #print-root .total{font-size:15pt;font-weight:700;border:1.2pt solid #000;padding:8pt 10pt;display:flex;justify-content:space-between;margin:6pt 0 14pt}
  #print-root h2{font-size:12pt;margin:14pt 0 2pt}
  #print-root .sig{display:grid;grid-template-columns:1fr 1fr;gap:40pt;margin-top:34pt;font-size:9.5pt}
  #print-root .sig div{border-top:.8pt solid #000;padding-top:4pt}
  #print-root .receipts{display:grid;grid-template-columns:1fr 1fr;gap:10pt}
  #print-root .receipts figure{margin:0;break-inside:avoid;border:.5pt solid #ccc;padding:6pt}
  #print-root .receipts img{width:100%;max-height:330pt;object-fit:contain}
  #print-root .receipts figcaption{font-size:8.5pt;color:#333;margin-top:4pt}
  #print-root .pb{break-before:page}
  #print-root .note{font-size:8.5pt;color:#555}
}
#update-bar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 64px);z-index:80;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-radius:16px;background:var(--elev);color:var(--label);box-shadow:0 10px 34px rgba(0,0,0,.22);font-size:14px;line-height:1.3;transform:translateY(160%);transition:transform .4s cubic-bezier(.32,.72,0,1);max-width:520px;margin:0 auto}
#update-bar.show{transform:none}
#update-bar svg{color:var(--blue);flex:none}
#update-bar .body{flex:1}
#update-bar .body span{color:var(--label2)}
#update-bar button{font-size:15px;font-weight:600;padding:8px 12px;border-radius:99px;color:var(--blue)}
#update-bar button.prim{background:var(--blue);color:#fff}

label.row{cursor:pointer}

.reimb .v{font-size:40px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

.btile.empty{background:transparent;box-shadow:none;border:1.5px dashed var(--fill2)}
.btile.empty .m{color:var(--blue)}
.btn.addr{margin-top:14px;min-height:54px;font-size:18px;border-radius:14px}
.dayh{display:flex;justify-content:space-between;font-size:13px;color:var(--label2);margin:18px 16px 7px;text-transform:uppercase;letter-spacing:.02em}
.tdetails{margin-top:26px}
.tdetails>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:13px 16px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);font-size:17px}

.tdetails[open]>summary::after{transform:rotate(-135deg)}
.tdetails .dnote{font-size:13px;color:var(--orange)}
.steps{display:flex;align-items:center;gap:6px;justify-content:center;margin:2px 0 14px}
.steps i{width:7px;height:7px;border-radius:50%;background:var(--fill2)}
.steps i.on{background:var(--blue);width:20px;border-radius:4px}

.steps span{font-size:12px;color:var(--label2);margin-left:6px}
.wz-q{font-size:22px;font-weight:700;text-align:center;margin:4px 0 12px}

.chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.chip3:active{opacity:.7}
.chip3 svg{width:22px;height:22px}
.bk-prog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--label2)}
.spinner.sm{width:20px;height:20px;border-width:3px}
.docrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:10px 12px;margin-top:10px;box-shadow:var(--shadow)}
.docrow img{width:44px;height:56px;object-fit:cover;border-radius:6px;border:.5px solid var(--sep)}
.docrow .body{flex:1;min-width:0}.docrow .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docrow .st{font-size:13px;color:var(--label2)}
.ok-badge{color:var(--green);display:flex}

/* ---------- Finance (3.3) ---------- */
.fin-year{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 10px}
.fin-year b{font-size:17px;font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.fin-year .navbtn[disabled]{opacity:.3}
.fin-sum{padding:16px 16px 12px}
.fs-net{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.fs-net span{font-size:15px;color:var(--label2);flex:1}
.fs-net b{font-size:30px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--green)}
.fs-net b.neg{color:var(--red)} .fs-net small{font-size:13px;color:var(--label2)}
.fs-line{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:15px;border-top:.5px solid var(--sep)}
.fs-line .l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-line b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.fs-sub{font-size:12px;color:var(--label2);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot.inc{background:var(--green)} .dot.out{background:var(--orange)} .dot.trip{background:var(--indigo)}
.switch.sm{width:40px;height:24px}
.switch.sm span::before{width:20px;height:20px}
.switch.sm input:checked+span::before{transform:translateX(16px)}
.fin-chart{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:96px;margin-top:12px;align-items:end}

.fb-col.now span{color:var(--blue)}
.fin-legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--label2);margin-top:8px}

.fin-seg{margin:18px 0 4px}

.fc-t{font-size:13px;font-weight:600;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-t.r{color:var(--red)}
.fcard b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.fc-s{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
/* ---- v3.4: flag cards ---- */
.hero.flagged{background:color-mix(in srgb,var(--tint,#8e8e93) 9%,var(--card));color:var(--label);box-shadow:var(--shadow),inset 0 0 0 .5px color-mix(in srgb,var(--tint,#8e8e93) 25%,transparent);isolation:isolate}
.hero.flagged>*{position:relative;z-index:1}
.hero .hflag,.thero .hflag{position:absolute!important;z-index:0!important;top:0;right:0;bottom:0;width:62%;pointer-events:none;opacity:.62;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.35) 30%,#000 75%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.35) 30%,#000 75%)}
.hflag svg{width:100%;height:100%;display:block}
.hero.flagged .k{color:var(--label2);opacity:1}
.hero.flagged .k svg{color:var(--tint)}
.hero.flagged .dates{color:var(--label2);opacity:1}
.hero.flagged .city{text-shadow:0 0 18px var(--card),0 0 4px var(--card)}
.hero.flagged .stat{background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);box-shadow:inset 0 0 0 .5px var(--sep)}
.hero.flagged .stat span{color:var(--label2);opacity:1}
.hero.flagged .progress{background:color-mix(in srgb,var(--label) 10%,transparent)}
.hero.flagged .progress i{background:color-mix(in srgb,var(--tint) 85%,var(--label) 15%)}
.hero.idle.flagged{background:color-mix(in srgb,var(--tint,#8e8e93) 7%,var(--card))}
@media (prefers-color-scheme:dark){.hero .hflag{opacity:.5}}
:root[data-theme=dark] .hero .hflag{opacity:.5}
:root[data-theme=light] .hero .hflag{opacity:.62}
.thero.flagged{position:relative;margin:0 -16px;padding:4px 16px 2px;overflow:hidden;isolation:isolate}
.thero.flagged>*{position:relative;z-index:1}
.thero .hflag{width:60%;opacity:.42;-webkit-mask-image:linear-gradient(90deg,transparent,#000 70%),linear-gradient(0deg,transparent,#000 45%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 70%),linear-gradient(0deg,transparent,#000 45%);mask-composite:intersect}
.attrow{align-items:flex-start;padding-top:12px;padding-bottom:12px}
.attbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.attbtns .btn{flex:none}
/* 3.5 — exchange-rate pending marker */
.fxp{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:99px;font-size:10px;font-weight:600;letter-spacing:.1px;color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent);white-space:nowrap;vertical-align:1px}
.fxp.yr{color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.fxp.est{color:var(--label2);background:var(--fill)}
.fx-row .fx-s.pend{color:var(--orange)}

/* ---------- 3.6 Clients · machines · service reports ---------- */
.hero .stats.s2{grid-template-columns:repeat(2,1fr)}
.ico.t{font-size:11px;font-weight:700;letter-spacing:.01em}
.field+.row::before,.row+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.cstats>div{background:var(--card);border-radius:12px;padding:10px 8px;text-align:center;box-shadow:var(--shadow);min-width:0}
.cstats b{display:block;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cstats span{display:block;font-size:12px;color:var(--label2);margin-top:2px}
.stepbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:2px 0 6px}
.stepbar i{height:4px;border-radius:2px;background:var(--fill2)}
.stepbar i.on{background:var(--blue)}
.stepcap{font-size:13px;color:var(--label2);margin:0 2px 12px}
.foot.warnline{color:var(--orange);font-weight:500}
.rhead{display:flex;gap:6px;margin:2px 0 12px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--fill);display:grid;place-items:center;color:var(--blue)}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.photos .ph button svg{width:12px;height:12px}
.photos .ph.add{cursor:pointer}.photos .ph.add svg{width:26px;height:26px}
.sigprev{height:34px;max-width:120px;object-fit:contain;filter:none}
[data-theme=dark] .sigprev{background:#fff;border-radius:6px;padding:2px}
#sigpad{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#sigpad .sp-card{background:var(--bg);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
#sigpad .sp-h{display:flex;align-items:center;justify-content:space-between;min-height:48px}
#sigpad .sp-h .tt{font-weight:600;font-size:17px}
#sigpad .sp-h .navbtn{min-width:64px}#sigpad .sp-h .navbtn.r{justify-content:flex-end;font-weight:600}
#sigpad .sp-sub{font-size:14px;color:var(--label2);text-align:center;margin-bottom:8px}
#sigpad .sp-box{position:relative;height:210px;background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;touch-action:none}
#sigpad canvas{width:100%;height:100%;display:block;touch-action:none}
#sigpad .sp-line{position:absolute;left:18px;right:18px;bottom:46px;border-top:1px solid #d1d1d6;pointer-events:none}
/* v3.8 merged Trips page */
.hero .stats.s1{grid-template-columns:minmax(0,150px)}
.loclink{margin:10px 4px 0;display:flex;gap:16px;flex-wrap:wrap}
.loclink .linkbtn{display:inline-flex;align-items:center;gap:6px}
.loclink .linkbtn svg{width:16px;height:16px}
#hero-local{width:100%}

/* v4.0 — Trips page: days-left line, thin previous-trip cards */
.hero .daysl{font-size:15px;font-weight:600;margin-top:10px}
.hero.flagged .daysl{color:var(--label)}
.pcards{display:flex;flex-direction:column;gap:8px}
.pcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:9px 14px;box-shadow:var(--shadow);color:var(--label)}
.pcard:active{background:var(--fill)}
.pflag{flex:none;width:34px;height:24px;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 .5px rgba(128,128,128,.35);background:var(--fill);color:var(--label2)}
.pflag svg{width:100%;height:100%;display:block}
.pbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pt{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .pd{font-weight:400;font-size:13px;color:var(--label2);margin-left:8px}
.pp{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pamt{flex:none;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

  function validDate(y, m, d) {
    if (!(y >= 2000 && y <= 2100 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return false;
    const dt = new Date(Date.UTC(y, m - 1, d));

  function fixYear(y) { y = parseInt(y, 10); if (y < 100) y += 2000; return y; }

  /* Normalize OCR text: unify spaces, dashes, fix O/0 confusions inside numbers */

  /* ---------- Dates ---------- */
  // Returns array of {date:'YYYY-MM-DD', index, raw, hasYear}
  function findDates(text, opts = {}) {
    const refYear = opts.refYear || new Date().getFullYear();
    const out = [];
    const t = text;
    const push = (y, m, d, idx, raw, hasYear = true) => {
      if (validDate(y, m, d)) out.push({ date: iso(y, m, d), index: idx, raw, hasYear });
    };
    let m;
    // yyyy-mm-dd / yyyy/mm/dd
    const r1 = /\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/g;
    while ((m = r1.exec(t))) push(+m[1], +m[2], +m[3], m.index, m[0]);
    // dd/mm/yyyy or dd-mm-yy or dd.mm.yyyy (prefer day-first; switch if month>12)
    const r2 = /(?<![\d\/.-])(\d{1,2})\s?[\/.-]\s?(\d{1,2})\s?[\/.-]\s?(\d{4}|\d{2})(?![\d\/-])/g;
    while ((m = r2.exec(t))) {
      let a = +m[1], b = +m[2], y = fixYear(m[3]);
      if (b > 12 && a <= 12) { const tmp = a; a = b; b = tmp; }
      push(y, b, a, m.index, m[0]);
    }
    // 12 octobre 2026 / 12 oct. 2026 / 12-OCT-26 / 12OCT26 / 1er novembre 2026
    const r3 = new RegExp('(?<![\\d])(\\d{1,2})(?:er|st|nd|rd|th)?[\\s.\\-/]*' + MONTH_RE + '\\.?[\\s.\\-/,]*(\\d{4}|\\d{2})?(?![\\d])', 'gi');
    while ((m = r3.exec(t))) {
      const mon = MONTHS[strip(m[2].toLowerCase())] || MONTHS[m[2].toLowerCase()];
      if (!mon) continue;
      const hasYear = !!m[3];
      // Avoid matching "12 mar" in random words: require month token boundary
      const after = t.charAt(m.index + m[0].length);
      if (/[a-zà-ü]/i.test(after) && !m[3]) continue;
      const y = hasYear ? fixYear(m[3]) : refYear;
      push(y, mon, +m[1], m.index, m[0], hasYear);
    }
    // October 12, 2026 / Oct 12 2026
    const r4 = new RegExp('\\b' + MONTH_RE + '\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s+(\\d{4})\\b', 'gi');
    while ((m = r4.exec(t))) {
      const mon = MONTHS[strip(m[1].toLowerCase())] || MONTHS[m[1].toLowerCase()];
      if (mon) push(+m[3], mon, +m[2], m.index, m[0]);
    }
    // de-dup by index
    out.sort((a, b) => a.index - b.index);
    const seen = new Set();
    return out.filter(d => { const k = d.index; if (seen.has(k)) return false; seen.add(k); return true; });
  }

  function pickReceiptDate(text, opts = {}) {
    const dates = findDates(text, opts);
    if (!dates.length) return { value: null, conf: 0 };
    const lower = text.toLowerCase();
    const today = opts.today || new Date().toISOString().slice(0, 10);
    let best = null, bestScore = -1e9;
    for (const d of dates) {
      let s = 0;
      const ctx = lower.slice(Math.max(0, d.index - 25), d.index);
      if (/date|le |du |fait|émis|emis|issued|invoice|facture/.test(ctx)) s += 3;
      if (/naiss|birth|expir|valid|exp\b|échéance|echeance|due/.test(ctx)) s -= 6;
      if (d.date > today) { // future: penalize unless no year (assume past year)
        s -= 4;
      }
      if (!d.hasYear) s -= 1;
      if (opts.near) { const diff = Math.abs(daysBetween(d.date, opts.near)); s -= Math.min(diff, 400) / 30; }
      s -= d.index / 5000; // earlier slightly preferred
      if (s > bestScore) { bestScore = s; best = d; }
    }
    return { value: best.date, conf: bestScore >= 2 ? 0.9 : best.hasYear ? 0.75 : 0.5, all: dates.map(d => d.date) };
  }

  function daysBetween(a, b) {

  /* ---------- Amounts ---------- */
  const NUM_RE = /(?<![\d.,])(\d{1,3}(?:[ .,'](?=\d{3}(?!\d))\d{3})+(?:[.,]\d{1,3})?|\d+(?:[.,]\d{1,3})?)(?![\d])/g;

  function parseNumberToken(tok, currency) {
    let s = tok.replace(/'/g, ' ').trim();
    const dec = currency && CURRENCIES[currency] ? CURRENCIES[currency].dec : 2;
    // Identify last separator
    const lastSep = Math.max(s.lastIndexOf('.'), s.lastIndexOf(','));
    const spaced = s.includes(' ');
    if (lastSep === -1) return parseFloat(s.replace(/ /g, ''));
    const tail = s.slice(lastSep + 1);
    const head = s.slice(0, lastSep);
    const sepChar = s.charAt(lastSep);
    const sepCount = (s.match(/[.,]/g) || []).length;
    if (tail.length === 3) {
      // 3 digits after separator: thousands unless 3-decimal currency w/ single sep
      if (dec === 3 && sepCount === 1 && !spaced) return parseFloat(head.replace(/[ .,]/g, '') + '.' + tail);
      // Mixed separators like 1.234,567? treat as thousands
      return parseFloat(s.replace(/[ .,]/g, ''));
    }
    if (tail.length <= 2) {
      // decimal separator
      const other = sepChar === '.' ? ',' : '.';
      return parseFloat(head.replace(new RegExp('[ ' + (other === '.' ? '\\.' : ',') + ']', 'g'), '').replace(/[.,]/g, '') + '.' + tail);
    }
    return parseFloat(s.replace(/[ .,]/g, ''));
  }

  function amountsInLine(line, currency) {
    const res = [];
    let m;
    NUM_RE.lastIndex = 0;
    while ((m = NUM_RE.exec(line))) {
      const tok = m[1];
      const before = line.slice(Math.max(0, m.index - 12), m.index).toLowerCase();
      const after = line.slice(m.index + tok.length, m.index + tok.length + 6).toLowerCase();
      // skip dates / times / percentages / phone-like / ids
      if (/^\s*[\/:]\d/.test(after) || /\d[\/:]\s*$/.test(before)) continue;
      if (/^\s*%/.test(after)) continue;
      if (/(tel|tél|phone|fax|n°|no\.?|nif|rccm|ifu|ice|rc|cnss|bp|b\.p|ncc|tin|vat no|id|pnr|ref|réf|ticket|facture n|invoice no|caisse|table|cpte|compte)\s*[:#]?\s*$/.test(before)) continue;
      const digits = tok.replace(/\D/g, '');
      if (digits.length >= 9 && !/[ .,]/.test(tok)) continue; // phone/id numbers
      const v = parseNumberToken(tok, currency);
      if (!isFinite(v) || v <= 0) continue;
      res.push({ value: v, raw: tok, index: m.index });
    }
    return res;
  }

  const TOTAL_KEYS = [

  function pickTotal(text, currency) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const cands = [];
    lines.forEach((line, i) => {
      let kw = 0;
      for (const [re, w] of TOTAL_KEYS) if (re.test(line)) { kw = Math.max(kw, w); }
      const bad = NOT_TOTAL.test(line) && !/ttc|net\s*[àa]\s*payer|total\s*[àa]\s*payer/i.test(line);
      let amts = amountsInLine(line, currency);
      let src = line;
      if (kw && !amts.length && lines[i + 1]) { amts = amountsInLine(lines[i + 1], currency); src = lines[i + 1]; }
      amts.forEach(a => {
        let s = kw;
        if (bad) s -= 6;
        if (hasCurrencyMark(src)) s += 1.5;
        if (/[.,]\d{2}\b/.test(a.raw)) s += 0.5;
        s += (i / Math.max(1, lines.length)) * 1.5; // totals usually near the bottom
        if (a.value < 1) s -= 3;
        cands.push({ value: a.value, score: s, line, kw });
      });
    });
    if (!cands.length) return { value: null, conf: 0 };
    const withKw = cands.filter(c => c.kw > 0 && c.score > 2);
    let best;
    if (withKw.length) {
      withKw.sort((a, b) => b.score - a.score || b.value - a.value);
      best = withKw[0];
      // If several equally strong total lines, prefer the larger (TTC vs HT)
      const top = withKw.filter(c => c.score >= best.score - 0.6);
      best = top.reduce((a, b) => (b.value > a.value ? b : a), best);
      return { value: round(best.value, currency), conf: best.kw >= 7 ? 0.9 : 0.7, line: best.line };
    }

    const marked = cands.filter(c => hasCurrencyMark(c.line));
    const pool = marked.length ? marked : cands;
    best = pool.reduce((a, b) => (b.value > a.value ? b : a));
    return { value: round(best.value, currency), conf: 0.4, line: best.line };

  /* ---------- Currency ---------- */
  const CEMAC = /(cameroun|cameroon|douala|yaound|gabon|libreville|brazzaville|pointe[- ]noire|congo(?!.*kinshasa)|tchad|chad|n'?djamena|centrafrique|bangui|malabo|guin[ée]e [ée]quatoriale|beac|xaf)/i;
  function detectCurrency(text, fallback) {
    const t = ' ' + text + ' ';
    const scores = {};
    const add = (c, s) => { scores[c] = (scores[c] || 0) + s; };
    const count = re => (t.match(re) || []).length;
    const explicit = ['USD', 'EUR', 'GBP', 'XOF', 'XAF', 'MAD', 'DZD', 'TND', 'EGP', 'NGN', 'GHS', 'KES', 'UGX', 'TZS', 'RWF', 'ETB', 'ZAR', 'CDF', 'GNF', 'MUR', 'AOA', 'MZN', 'ZMW', 'BWP', 'MGA', 'AED', 'SAR', 'QAR', 'DJF', 'LYD', 'MRU'];
    explicit.forEach(c => { const n = count(new RegExp('\\b' + c + '\\b', 'g')); if (n) add(c, 5 * n); });
    const cfa = count(/f\.?\s?cfa|\bcfa\b|\bfcfa\b|francs?\s*cfa/gi);
    if (cfa) add(CEMAC.test(t) ? 'XAF' : 'XOF', 4 * cfa);
    const n = (re, c, w) => { const k = count(re); if (k) add(c, w * k); };
    n(/€|\beuros?\b/gi, 'EUR', 3);
    n(/£/g, 'GBP', 3);
    n(/US\s?\$|\$\s?US|\bdollars?\b/gi, 'USD', 4);
    n(/\$/g, 'USD', 1.5);
    n(/₦|\bnaira\b|\bN(?=\s?\d{1,3}(,\d{3})+)/g, 'NGN', 4);
    n(/GH₵|₵|GH¢|\bcedis?\b|\bGHC\b/gi, 'GHS', 4);
    n(/\bK\s?sh\.?|\bKES\b|\bshillings?\b/gi, 'KES', 3);
    n(/\bbirr\b|\bbr\.?(?=\s?\d)/gi, 'ETB', 3);
    n(/\bdhs?\b|\bdirhams?\b/gi, /dubai|uae|émirats|emirates/i.test(t) ? 'AED' : 'MAD', 3);
    n(/\d\s?DA\b|\bDA\s?\d|\bdinars? alg/gi, 'DZD', 3);
    n(/\d\s?DT\b|\bDT\s?\d|\bdinars? tun/gi, 'TND', 3);
    n(/\bL\.?E\.?(?=\s?\d)|E£|\bjunaih|\bgeneh|\bpounds? egypt/gi, 'EGP', 3);
    n(/\bR\s?\d{1,3}([ ,]\d{3})*\.\d{2}\b|\brand\b/g, 'ZAR', 1.5);
    n(/\bFRW\b|\bRwf\b/gi, 'RWF', 4);
    n(/\bUSh\b/gi, 'UGX', 3); n(/\bTSh\b/gi, 'TZS', 3);
    n(/\bFG\b|\bGNF\b/g, 'GNF', 2); n(/\bFC\b(?=\s?\d)|\d\s?FC\b/g, 'CDF', 2);
    n(/\bKz\b/g, 'AOA', 2); n(/\d\s?MT\b|\bMZN\b/g, 'MZN', 2);
    // Context from places (weak)
    const place = detectPlace(text);
    if (place) add(place.currency, 1.2);
    let best = null, bs = 0;
    for (const [c, s] of Object.entries(scores)) if (s > bs) { bs = s; best = c; }
    if (!best) return { value: fallback || null, conf: fallback ? 0.3 : 0 };
    return { value: best, conf: bs >= 4 ? 0.9 : bs >= 2.5 ? 0.7 : 0.45 };
  }

  /* ---------- Places ---------- */
  function detectPlace(text) {
    const low = strip(text.toLowerCase());
    let best = null, bestIdx = 1e9;
    for (const p of PLACES) {
      const names = [p[0], ...p[4]].map(x => strip(x.toLowerCase()));
      for (const nm of names) {
        if (nm.length < 4) continue;
        const re = new RegExp('(^|[^a-z])' + nm.replace(/[.*+?^${}()|[\]\\']/g, '\\$&') + '($|[^a-z])');
        const mm = re.exec(low);
        if (mm && mm.index < bestIdx) { bestIdx = mm.index; best = p; }
      }
    }
    return best ? { city: best[0], country: best[1], currency: best[2], iata: best[3][0] } : null;
  }
  function placeFromIata(code) { const p = IATA[code]; return p ? { city: p[0], country: p[1], currency: p[2], iata: code } : null; }

  /* ---------- Vendor & category ---------- */
  const BRANDS = [

    ['Moov Africa', /\bmoov\b/i, 'Phone / Data'], ['Airtel', /\bairtel\b/i, 'Phone / Data'], ['Safaricom', /safaricom|m-?pesa/i, 'Phone / Data'],

    ['Pizza Hut', /pizza\s?hut/i, 'Meals'], ['Chicken Republic', /chicken\s?republic/i, 'Meals'], ['Shoprite', /shoprite/i, 'Meals'],
    ['Radisson', /radisson/i, 'Lodging'], ['Marriott', /marriott/i, 'Lodging'], ['Novotel', /novotel/i, 'Lodging'], ['Ibis', /\bibis\b/i, 'Lodging'],
    ['Pullman', /pullman/i, 'Lodging'], ['Sofitel', /sofitel/i, 'Lodging'], ['Hilton', /hilton/i, 'Lodging'], ['Sheraton', /sheraton/i, 'Lodging'],
    ['Onomo', /onomo/i, 'Lodging'], ['Azalaï', /azala[iï]/i, 'Lodging'], ['Golden Tulip', /golden\s?tulip/i, 'Lodging'], ['Mövenpick', /m[öo]venpick/i, 'Lodging'],

  const CATEGORY_RULES = [
    ['Flights', /(boarding|e-?ticket|billet [ée]lectronique|carte d'embarquement|itin[ée]raire|itinerary|passenger|passager|flight|vol\b|airline|compagnie a[ée]rienne|airways|pnr|baggage|bagage)/i],

    ['Ground Transport', /(taxi|cab\b|vtc|course|trajet|trip fare|chauffeur|driver|carburant|essence|gasoil|gazole|super sans plomb|diesel|fuel|petrol|station[- ]service|p[ée]age|toll|parking|transport|bus\b|train|sncf|location de voiture|car rental|moto|zemidjan|airport transfer|transfert)/i],
    ['Phone / Data', /(recharge|cr[ée]dit|carte sim|\bsim\b|forfait|pass internet|data|internet|airtime|bundle|mobile money|unit[ée]s|telecom|t[ée]l[ée]com)/i],
    ['Meals', /(restaurant|resto|caf[ée]\b|maquis|brasserie|boulangerie|p[âa]tisserie|snack|grill|repas|d[ée]jeuner|d[îi]ner|petit[- ]d[ée]jeuner|breakfast|lunch|dinner|food|pizza|burger|poulet|chicken|poisson|boisson|drinks?|bi[èe]re|beer|coca|eau min|water|plat|menu|couverts?|serveur|waiter|table\s?\d|supermarch|supermarket|alimentation|epicerie|[ée]picerie)/i],
    ['Tips', /(pourboire|\btips?\b|gratuity)/i],
    ['Visa / Fees', /(visa\b(?!.*card)|e-?visa|frais de dossier|airport tax|taxe a[ée]roport|timbre fiscal|fee\b|frais\b|permit|vaccin|covid|pcr)/i],
    ['Laundry', /(blanchisserie|pressing|laundry|lavage|dry clean)/i],
    ['Site / Materials', /(quincaillerie|hardware|outils?|tools?|c[âa]ble|cable|fournitures?|supplies|pi[èe]ces? d[ée]tach[ée]es|spare parts|[ée]lectricit[ée]|imprimerie|printing|photocop|batterie|battery|adaptateur|adapter|consommables?)/i]
  ];

  function guessCategory(text, vendor) {
    const brand = BRANDS.find(b => b[1].test(text));
    const scores = {};
    for (const [cat, re] of CATEGORY_RULES) {
      const g = new RegExp(re.source, 'gi');
      const k = (text.match(g) || []).length;
      if (k) scores[cat] = k * (cat === 'Laundry' ? 4 : 1); // laundry at a hotel is a specific out-of-pocket item
    }
    if (brand) scores[brand[2]] = (scores[brand[2]] || 0) + 3;
    if (vendor) for (const [cat, re] of CATEGORY_RULES) if (re.test(vendor)) scores[cat] = (scores[cat] || 0) + 2;
    let best = null, bs = 0;
    for (const [c, s] of Object.entries(scores)) if (s > bs) { bs = s; best = c; }
    return { value: best || 'Other', conf: bs >= 3 ? 0.85 : bs >= 1 ? 0.6 : 0.2 };
  }

  const VENDOR_SKIP = /(re[çc]u|receipt|facture|invoice|ticket\s*(de\s*caisse|n)|bienvenue|welcome|merci|thank|\bdate\b|\bheure\b|\btime\b|\bt[ée]l\b|\btel[:.]|phone|\bfax\b|adresse|address|\brue\b|avenue|\bbp\b|b\.p|rccm|\bnif\b|\bifu\b|n°|www\.|@|caisse|cashier|\bclient\b|\btable\b|copie|duplicata|original|\btva\b|\btotal\b)/i;
  function pickVendor(text) {
    const brandHit = BRANDS.find(b => b[1].test(text.slice(0, 400)));
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean).slice(0, 8);
    let best = null, bs = -1;
    lines.forEach((l, i) => {
      if (l.length < 3 || l.length > 48) return;
      if (VENDOR_SKIP.test(l)) return;
      const letters = (l.match(/[A-Za-zÀ-ÿ]/g) || []).length;
      const ratio = letters / l.replace(/\s/g, '').length;
      if (ratio < 0.6 || letters < 3) return;
      let s = ratio * 3 - i * 0.7;
      if (/^[A-ZÀ-Ý0-9 '&.\-]+$/.test(l) && letters >= 4) s += 1.2; // ALL CAPS header
      if (/(sarl|sa\b|sas|ltd|limited|plc|inc|ets|établissements|restaurant|hotel|hôtel|station|pharmacie|supermarch|taxi|caf[ée])/i.test(l)) s += 1.5;
      if (s > bs) { bs = s; best = l; }
    });
    if (brandHit && (!best || !brandHit[1].test(best))) {
      return { value: brandHit[0], conf: 0.8 };
    }
    if (!best) return { value: '', conf: 0 };
    const clean = best.replace(/\s{2,}/g, ' ').replace(/^[^A-Za-zÀ-ÿ0-9]+|[^A-Za-zÀ-ÿ0-9.)]+$/g, '');
    return { value: titleCase(clean), conf: bs > 2.5 ? 0.7 : 0.5 };
  }
  function titleCase(s) {
    if (s !== s.toUpperCase()) return s;
    return s.toLowerCase().replace(/(^|[\s\-'(])([a-zà-ÿ])/g, (m, a, b) => a + b.toUpperCase()).replace(/\b(Sarl|Sa|Sas|Ltd|Plc)\b/g, x => x.toUpperCase());
  }

  /* ---------- Document type ---------- */
  function detectDocType(text, hint) {
    const t = text.toLowerCase();
    const flight = (t.match(/(e-?ticket|boarding|billet|itin[ée]raire|itinerary|passenger|passager|flight|\bvol\b|pnr|booking ref|record locator|seat|si[èe]ge|terminal|departure|arrival|d[ée]part|arriv[ée]e|airline|airways|baggage|bagage)/g) || []).length;
    const hotel = (t.match(/(h[ôo]tel|check[- ]?in|check[- ]?out|arriv[ée]e|nights?|nuit|room|chambre|reservation|r[ée]servation|guest|folio|accommodation)/g) || []).length;
    const iataPairs = findRoute(text).length;
    const flightScore = flight + iataPairs * 3 + (hint === 'TICKET' ? 4 : 0);
    const hotelScore = hotel + (hint === 'HOTEL' ? 4 : 0) - (iataPairs ? 2 : 0);
    if (flightScore >= 5 && flightScore >= hotelScore) return 'TICKET';
    if (hotelScore >= 4 && /check[- ]?in|arriv|nuit|night/.test(t) && /(h[ôo]tel|lodge|resort|booking\.com|expedia|room|chambre)/.test(t)) return 'HOTEL';
    if (hint === 'TICKET' || hint === 'HOTEL') return hint;
    return 'RECEIPT';
  }

  /* ---------- Flight tickets ---------- */
  function findRoute(text) {
    const segs = [];
    const re = /\b([A-Z]{3})\s*(?:-|–|→|->|>|\/|to|à|a|vers)\s*([A-Z]{3})\b/g;
    let m;
    while ((m = re.exec(text))) {
      if (IATA[m[1]] && IATA[m[2]] && m[1] !== m[2]) segs.push({ from: m[1], to: m[2], index: m.index });
    }
    if (!segs.length) {
      // Tables such as "HF 744  Abidjan (ABJ)  Libreville (LBV)  28OCT26": pair codes on the same line first,
      // then fall back to proximity. Ambiguous 3-letter words only count when written as "(XXX)".
      const AMBIG = /^(MAD|MRU|PNR|MBA|ACC|CAS|ALG|FRA|ADD|DAR|AMS|BRU|LOS|TUN|CAI|TIP|TAX|THE|AND|FOR|NET|VAT|TVA|REF|CAR|BUS|DAY|BAR|PAX)$/;
      const codesIn = (str, offset) => {
        const out = []; const r2 = /\b([A-Z]{3})\b/g; let mm;
        while ((mm = r2.exec(str))) {
          if (!IATA[mm[1]]) continue;
          const before = str.slice(Math.max(0, mm.index - 30), mm.index), after = str.slice(mm.index + 3, mm.index + 6);
          const paren = /\(\s*$/.test(before) && /^\s*\)/.test(after);
          if (AMBIG.test(mm[1]) && !paren) continue;
          // "Booking reference (PNR): X" is a label, not Pointe-Noire
          if (mm[1] === 'PNR' && (/(ref|booking|record|code|locator|dossier|r[ée]servation)[^\n]{0,6}$/i.test(before) || /^\s*\)?\s*[:#]/.test(after))) continue;
          out.push({ code: mm[1], index: offset + mm.index, paren });
        }
        return out;
      };
      let off = 0;
      for (const line of text.split('\n')) {
        let cs = codesIn(line, off); off += line.length + 1;
        if (cs.some(c => c.paren)) cs = cs.filter(c => c.paren);
        if (cs.length >= 2 && cs[0].code !== cs[1].code) segs.push({ from: cs[0].code, to: cs[1].code, index: cs[0].index, weak: !cs[0].paren });
      }
      if (!segs.length) {
        const codes = codesIn(text, 0);
        for (let i = 0; i + 1 < codes.length; i++) {
          if (codes[i].code !== codes[i + 1].code && codes[i + 1].index - codes[i].index < 120) {
            segs.push({ from: codes[i].code, to: codes[i + 1].code, index: codes[i].index, weak: true }); i++;
          }
        }
      }
    }
    return segs;
  }

  function parseTicket(text, opts = {}) {
    const res = {};
    const kwRe = /(PNR|booking\s*(?:ref(?:erence)?|code|number)|record\s*locator|r[ée]f[ée]rence\s*(?:de\s*)?(?:r[ée]servation|dossier)|code\s*(?:de\s*)?r[ée]servation|confirmation\s*(?:code|number)?|dossier)/gi;
    let km;
    while ((km = kwRe.exec(text)) && !res.pnr) {
      const win = text.slice(km.index + km[0].length, km.index + km[0].length + 40);
      const cands = win.match(/\b[A-Z0-9]{6}\b/g) || [];
      const c = cands.find(x => x !== 'NUMBER' && x !== 'BOOKING' && /[A-Z]/.test(x) && !/^(TICKET|DOSSIER|RECORD)$/.test(x));
      if (c) res.pnr = { value: c, conf: 0.9 };
    }
    const flights = [];
    const fr = /\b([A-Z]{2}|[A-Z]\d|\d[A-Z])\s?-?\s?(\d{2,4})\b/g;
    let m;
    while ((m = fr.exec(text))) {
      if (AIRLINES[m[1]] && !/^(20\d\d)$/.test(m[2])) flights.push({ code: m[1] + m[2], airline: AIRLINES[m[1]], index: m.index });
    }
    const uniqF = [...new Map(flights.map(f => [f.code, f])).values()];
    if (uniqF.length) res.flights = { value: uniqF.map(f => f.code), conf: 0.8 };
    let airline = uniqF[0]?.airline;
    if (!airline) { for (const name of Object.values(AIRLINES)) if (text.toLowerCase().includes(name.toLowerCase())) { airline = name; break; } }
    if (airline) res.airline = { value: airline, conf: uniqF.length ? 0.85 : 0.6 };
    const segs = findRoute(text);
    const dates = findDates(text, opts).map(d => d.date);
    const uniqDates = [...new Set(dates)].sort();
    if (segs.length) {
      const home = opts.homeIata;
      const first = segs[0];
      let dest = first.to;
      if (home && first.from !== home && first.to === home && segs[1]) dest = segs[1].to;
      // Prefer the turning point: the "to" of the segment before a return toward origin
      const origin = first.from;
      for (const s of segs) { if (s.to === origin) break; dest = s.to; }
      const place = placeFromIata(dest);
      res.route = { value: segs.map(s => s.from + '→' + s.to).join(', '), conf: segs[0].weak ? 0.5 : 0.85 };
      res.origin = { value: origin, conf: 0.8 };
      if (place) {
        res.city = { value: place.city, conf: 0.85 }; res.country = { value: place.country, conf: 0.85 };
        res.currency = { value: place.currency, conf: 0.8 };
      }
      res.roundTrip = segs.some(s => s.to === origin);
    } else {
      const pl = detectPlace(text);
      if (pl) { res.city = { value: pl.city, conf: 0.5 }; res.country = { value: pl.country, conf: 0.5 }; res.currency = { value: pl.currency, conf: 0.45 }; }
    }
    if (uniqDates.length) {
      res.startDate = { value: uniqDates[0], conf: 0.75 };
      // Issue dates may precede travel; if a "date of issue" exists, skip it
      const issue = text.match(/(date\s*(?:of\s*)?(?:issue|d'[ée]mission|[ée]mission)|issued|[ée]mis le)[^\n\d]{0,15}([^\n]{6,20})/i);
      if (issue) {
        const idt = findDates(issue[2], opts)[0];
        if (idt) {
          const rest = uniqDates.filter(d => d !== idt.date);
          if (rest.length) { res.startDate = { value: rest[0], conf: 0.8 }; res.issueDate = idt.date; }
        }
      }
      const travel = uniqDates.filter(d => d >= res.startDate.value);
      if (travel.length > 1) res.endDate = { value: travel[travel.length - 1], conf: res.roundTrip ? 0.8 : 0.55 };
    }
    return res;
  }

  /* ---------- Hotel bookings ---------- */
  function parseHotel(text, opts = {}) {
    const res = {};
    const lines = text.split('\n');
    const brand = BRANDS.find(b => b[2] === 'Lodging' && b[1].test(text));
    const hl = lines.find(l => /(h[ôo]tel|lodge|resort|suites|residence|r[ée]sidence|guest\s?house)/i.test(l) && l.length < 70 && !/(check|r[ée]servation|booking|confirmation|adresse|address)/i.test(l));
    if (hl) res.hotel = { value: titleCase(hl.replace(/^(hotel name|h[ôo]tel)\s*[:\-]\s*/i, '').trim()), conf: 0.75 };
    else if (brand) res.hotel = { value: brand[0], conf: 0.6 };
    const find = (re) => {
      const mm = re.exec(text);
      if (!mm) return null;
      const seg = text.slice(mm.index, mm.index + mm[0].length + 60);
      const d = findDates(seg, opts)[0];
      return d ? d.date : null;
    };
    const ci = find(/(check[- ]?in|arriv[ée]e|arrival|date d'arriv[ée]e|du\b)/i);
    const co = find(/(check[- ]?out|d[ée]part|departure|date de d[ée]part|au\b)/i);
    if (ci) res.checkIn = { value: ci, conf: 0.85 };
    if (co && (!ci || co > ci)) res.checkOut = { value: co, conf: 0.85 };
    if (!ci) {
      const ds = [...new Set(findDates(text, opts).map(d => d.date))].sort();
      if (ds.length >= 2) { res.checkIn = { value: ds[0], conf: 0.5 }; res.checkOut = { value: ds[ds.length - 1], conf: 0.45 }; }
    }
    const conf = text.match(/(?:itinerary|itin[ée]raire|confirmation|r[ée]servation|booking)\s*(?:#|n°|no\.?|number|num[ée]ro|code)?\s*[:#]?\s*([A-Z0-9-]{5,20})/i);
    if (conf && /\d/.test(conf[1])) res.confirmation = { value: conf[1], conf: 0.75 };
    const nights = text.match(/(\d{1,2})\s*(nights?|nuits?|nuit[ée]es?)/i);
    if (nights) res.nights = +nights[1];
    const pl = detectPlace(text);
    if (pl) { res.city = { value: pl.city, conf: 0.7 }; res.country = { value: pl.country, conf: 0.7 }; res.currency = { value: pl.currency, conf: 0.5 }; }
    return res;

/* ---------------- Expense editor (review sheet) ---------------- */
function newExpense(ctx = {}) {
  const date = ctx.date || todayISO();
  if (ctx.local) return openExpenseEditor({ date, tripId: null, local: true, currency: homeCur(), category: 'Fuel', paidBy: 'me', paymentMethod: 'Cash' }, { isNew: true });
  const r = ctx.tripId ? { trip: tripById(ctx.tripId), conf: 1, reason: 'Selected trip' } : resolveTrip(date);
  openExpenseEditor({ date, tripId: r.trip ? r.trip.id : null, currency: r.trip ? r.trip.defaultCurrency : base(), category: 'Ground Transport', paidBy: 'me', paymentMethod: 'Cash' }, { isNew: true, tripLocked: !!ctx.tripId });
}
/* Local expenses use exactly Fuel / Tolls / Maintenance / Other; trips keep the full list. */

/* One-time migration for v3.2: decide Travel vs Local for existing trips. */
function migrateV32() {
  if (!db || db.v32) return;
  const home = db.settings && db.settings.homeIata && P.IATA[String(db.settings.homeIata).toUpperCase()];
  for (const t of db.trips) {
    if (t.type === 'LOCAL') continue;
    t.type = 'TRAVEL';
    const company = db.expenses.some(e => e.tripId === t.id && e.paidBy === 'company');
    if (!company && !hasFlight(t) && !hasHotel(t)) {
      const atHome = home && t.city && home[0].toLowerCase() === t.city.trim().toLowerCase();
      if (atHome || tripLen(t) === 1) t.type = 'LOCAL';
    }
  }
  db.v32 = true;
}

/* ===================== VeriTrip 3.9 — Local expenses → Living expenses ===================== */
/* Every Local expense you paid yourself (and did not mark "Claim from company") is MIRRORED as one paid, one-off Living expense:
   id 'LIV-L-<expenseId>', srcExp = expense id. syncLocalLiving() runs on every save() and on load and rebuilds the mirror from the expenses,
   so there is a single source of truth: edit or delete the expense and the Living item follows; nothing can be counted twice.
   Fuel / Tolls / Maintenance go to the matching Car sub-category, everything else to Other. */
const LOCAL_LIV = { 'Fuel': 'fuel', 'Tolls': 'tolls', 'Maintenance': 'maint' };
const localLivCat = e => LOCAL_LIV[localCatKey(e.category)] || 'other';
const localInLiving = e => !!(e.local && e.paidBy === 'me' && !e.claim);
function syncLocalLiving() {
  const F = db && db.finance; if (!F || !Array.isArray(F.living)) return;
  const want = new Map(); for (const e of db.expenses) if (localInLiving(e)) want.set('LIV-L-' + e.id, e);
  F.living = F.living.filter(l => !l.srcExp || want.has(l.id));
  for (const [id, e] of want) {
    let l = F.living.find(x => x.id === id); if (!l) { l = { id, atts: [] }; F.living.push(l); }
    const fx = {}; for (const k of FXKEYS) if (e[k] != null) fx[k] = e[k];
    Object.assign(l, { name: e.merchant || catOf(e.category).label, category: localLivCat(e), freq: 'once', due: e.date, end: null, currency: e.currency, amount: +e.amount || 0,
      paid: { [e.date]: e.date }, payFx: { [e.date]: { ...fx } }, srcExp: e.id, hasReceipt: !!(e.hasFile || e.previewDataUrl), note: 'From receipt' }, fx);
    for (const k of FXKEYS) if (!(k in fx)) delete l[k];
  }
}
function localLivSheet(l) { // tap on a living item that comes from a local expense
  const e = db.expenses.find(x => x.id === l.srcExp); if (!e) return;
  actionSheet(`${l.name} · ${fmt(l.amount, l.currency)}`, [
    ...(e.hasFile || e.previewDataUrl ? [{ icon: 'doc', color: '#5856d6', label: 'View receipt', fn: () => showFile(e) }] : []),
    { icon: 'pencil', color: '#007aff', label: 'Edit expense', sub: 'Changes here update Finance → Living', fn: () => editExpense(e.id) },
    { icon: 'trash', color: '#ff3b30', label: 'Delete expense', sub: 'Also removes it from Living expenses', fn: () => confirmSheet('Delete expense?', `${l.name} · ${fmt(l.amount, l.currency)}`, 'Delete', () => { Files.del(e.id).catch(() => {}); db.expenses = db.expenses.filter(x => x.id !== e.id); save(); render(); toast('Deleted'); }) }]);
}

/* ---------- Migration (runs on every load; idempotent) ---------- */
function migrateV36() {
  db.machines = Array.isArray(db.machines) ? db.machines : [];
  db.reports = Array.isArray(db.reports) ? db.reports : [];
  db.svc = Object.assign({ seq: {} }, db.svc || {}); db.svc.seq = db.svc.seq || {};
  FIN().clients.forEach(c => { for (const k of ['address', 'city', 'country', 'contact', 'phone', 'email', 'note', 'reportedBy']) c[k] = c[k] == null ? '' : String(c[k]); });
  db.machines.forEach(m => {
    m.id = m.id || uid('MCH'); m.type = MTYPES.some(x => x.k === m.type) ? m.type : 'OT'; m.model = m.model || ''; m.serial = m.serial || ''; m.notes = m.notes || ''; m.dept = m.dept || ''; m.warranty = m.warranty === 'yes' ? 'yes' : 'no'; m.contract = m.contract || 'No';
    m.readings = (Array.isArray(m.readings) ? m.readings : []).map(r => ({ id: r.id || uid('RD'), kind: r.kind === 'helium' ? 'helium' : 'slice', value: +r.value, date: r.date || todayISO(), reportId: r.reportId || null, note: r.note || '', at: r.at || '' })).filter(r => isFinite(r.value));
    m.createdAt = m.createdAt || new Date().toISOString(); machineRecalc(m);
  });
  db.reports.forEach(r => {
    r.id = r.id || uid('SR'); r.parts = (r.parts || []).map(p => ({ id: p.id || uid('PT'), name: p.name || '', pn: p.pn || '', qty: +p.qty || 1, required: !!p.required, ordered: !!p.ordered, exch: !!p.exch }));
    r.photos = r.photos || []; r.status = r.status || 'ok'; r.job = r.job || 'other'; r.work = r.work || ''; r.remarks = r.remarks || ''; r.snap = r.snap || {};
    r.fault = r.fault || ''; r.warranty = r.warranty === 'yes' ? 'yes' : r.warranty === 'no' ? 'no' : ''; r.contract = r.contract == null ? '' : r.contract; r.sysDown = r.sysDown === 'yes' || r.sysDown === 'no' ? r.sysDown : (r.status === 'down' ? 'yes' : 'no'); r.downHours = r.downHours || '';
    r.dept = r.dept || ''; r.reportedBy = r.reportedBy || ''; r.travel = r.travel == null ? '' : String(r.travel); r.signClientName = r.signClientName || '';
    r.final = !!r.final; r.lang = r.lang === 'fr' ? 'fr' : 'en'; r.createdAt = r.createdAt || new Date().toISOString();
  });
}

/* ---------- Photos & signatures ---------- */
async function scaledPhoto(file, max = 1280) {
  const im = await loadImage(file); const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const mk = (w, h, q) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); return c; };
  const big = mk(im.naturalWidth * k, im.naturalHeight * k); const blob = await canvasToBlob(big, 0.78);
  const tk = Math.min(1, 160 / Math.max(im.naturalWidth, im.naturalHeight)); const thumb = mk(im.naturalWidth * tk, im.naturalHeight * tk).toDataURL('image/jpeg', 0.6);
  return { blob, thumb, w: big.width, h: big.height };
}
function sigPad(title, name) {
  return new Promise(res => {
    const o = document.createElement('div'); o.id = 'sigpad';
    o.innerHTML = `<div class="sp-card"><div class="sp-h"><button class="navbtn" id="sp-cancel">Cancel</button><div class="tt">${esc(title)}</div><button class="navbtn r" id="sp-done">Done</button></div>
      <div class="sp-sub">${esc(name || 'Sign with your finger')}</div><div class="sp-box"><canvas id="sp-c"></canvas><div class="sp-line"></div></div><button class="linkbtn" id="sp-clear" style="margin:10px auto 4px;display:block">Clear</button></div>`;
    document.body.appendChild(o);
    const c = $('#sp-c', o); const box = c.parentElement; const W = box.clientWidth || 340, H = box.clientHeight || 200; c.width = W * 2; c.height = H * 2;
    const x = c.getContext('2d'); x.scale(2, 2); x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0a2a66';
    let drawing = false, drawn = false, last = null;
    const pos = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    c.addEventListener('pointerdown', e => { e.preventDefault(); drawing = true; last = pos(e); c.setPointerCapture && c.setPointerCapture(e.pointerId); x.beginPath(); x.arc(last.x, last.y, 1.1, 0, 7); x.fillStyle = '#0a2a66'; x.fill(); drawn = true; });
    c.addEventListener('pointermove', e => { if (!drawing) return; e.preventDefault(); const p = pos(e); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(p.x, p.y); x.stroke(); last = p; });
    const up = () => { drawing = false; }; c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    const done = v => { o.remove(); res(v); };
    $('#sp-cancel', o).onclick = () => done(null);
    $('#sp-clear', o).onclick = () => { x.clearRect(0, 0, W, H); drawn = false; };
    $('#sp-done', o).onclick = () => done(drawn ? c.toDataURL('image/png') : '');
  });
}

  const rd = kind === 'slice' ? `${nfmt(r.sliceBefore)} → ${nfmt(r.sliceAfter)}${r.sliceAfter != null && r.sliceBefore != null ? ' (' + nfmt(r.sliceAfter - r.sliceBefore) + ' slices)' : ''}` : kind === 'helium' ? `${r.heliumBefore != null ? r.heliumBefore + ' %' : '—'} → ${r.heliumAfter != null ? r.heliumAfter + ' %' : '—'}` : '';
  openSheet({ title: r.no, left: { label: 'Close' }, right: !r.final ? { label: 'Edit', fn: () => { closeSheet(); setTimeout(() => openReportFlow({ report: r.id }), 320); } } : null,
    body: `<div class="rhead"><span class="pill ${r.final ? 'ok' : 'warn'}">${r.final ? 'Final' : 'Draft'}</span><span class="pill ${st[2]}">${st[1]}</span></div>
      <div class="group">${row('Client', [s.client, cityLine(s)].filter(Boolean).join(' — '))}${row('Machine', [mtype(s.type).label, s.model, s.serial ? 'SN ' + s.serial : ''].filter(Boolean).join(' · '))}${row('Date', fmtD(r.date, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' }) + (r.timeIn ? ` · ${r.timeIn}${r.timeOut ? '–' + r.timeOut : ''}` : ''))}${row('Job', jobLabel(r.job))}${row('Visit', [r.visitNo ? 'No. ' + r.visitNo : '', r.dept, r.reportedBy ? 'reported by ' + r.reportedBy : ''].filter(Boolean).join(' · '))}${row('Warranty / contract', [r.warranty === 'yes' ? 'Warranty' : 'No warranty', 'Contract: ' + (r.contract || 'No'), r.sysDown === 'yes' ? 'System down' + (r.downHours ? ' ' + r.downHours + ' h' : '') : ''].filter(Boolean).join(' · '))}${row(kind === 'slice' ? 'Slice counter' : 'Helium level', rd)}${row('Engineer', r.engineer)}${r.tripLabel ? row('Trip', r.tripLabel) : ''}</div>
      ${r.fault ? `<div class="ghead">Fault</div><div class="group">${row('', r.fault)}</div>` : ''}<div class="ghead">Work done</div><div class="group">${row('', r.work) || ''}</div>${r.remarks ? `<div class="ghead">Remarks</div><div class="group">${row('', r.remarks)}</div>` : ''}
      ${r.parts.length ? `<div class="ghead">Parts</div><div class="group">${r.parts.map(p => `<div class="row"><span class="body"><div class="t">${esc(p.name)}</div><div class="st">${esc([p.pn ? 'P/N ' + p.pn : '', 'Qty ' + p.qty].filter(Boolean).join(' · '))}</div></span><span class="pill ${p.required ? 'warn' : 'ok'}">${p.required ? (p.ordered ? 'Ordered' : 'To order') : (p.exch ? 'Exchange' : 'Used')}</span></div>`).join('')}</div>` : ''}
      ${r.photos.length ? `<div class="photos" style="margin-top:14px">${r.photos.map(p => `<div class="ph"><img src="${esc(p.thumb)}" alt=""></div>`).join('')}</div>` : ''}
      <div style="margin-top:18px;display:grid;gap:10px"><button class="btn" id="rp-share">${icon('share', 's')} Share / Save PDF</button><button class="btn tinted" id="rp-view">${icon('eye', 's')} Preview PDF</button>
      <button class="btn tinted" id="rp-fin">${r.final ? 'Reopen for editing' : 'Finalize report'}</button></div>
      <div class="group" style="margin-top:20px"><button class="row tap" id="rp-del"><span class="body" style="color:var(--red);text-align:center">Delete report</span></button></div>`,
    onMount: b => {
      $('#rp-share', b).onclick = () => shareReportPdf(r); $('#rp-view', b).onclick = () => previewReportPdf(r);
      $('#rp-fin', b).onclick = () => { r.final = !r.final; r.finalizedAt = r.final ? new Date().toISOString() : null; r.updatedAt = new Date().toISOString(); save(); toast(r.final ? 'Report finalized' : 'Report reopened'); reportSheet(id); render(); };
      $('#rp-del', b).onclick = () => confirmSheet('Delete report?', `${r.no} and its readings are removed. The number is not reused.`, 'Delete', () => deleteReport(r.id));
    } });
}
async function deleteReport(id) {
  const r = reportById(id); if (!r) return;
  const m = machineById(r.machineId); if (m) { m.readings = m.readings.filter(x => x.reportId !== id); machineRecalc(m); }
  for (const p of r.photos || []) await Files.del(p.id);
  db.reports = db.reports.filter(x => x.id !== id); save(); render(); toast('Report deleted');
}

/* ---------- Reports list, parts to order, CSV ---------- */
function reportsMatching(q, f) {
  q = (q || '').trim().toLowerCase();
  return reportsSorted(db.reports).filter(r => (f === 'draft' ? !r.final : f === 'final' ? r.final : true) &&
    (!q || [r.no, (r.snap || {}).client, (r.snap || {}).model, (r.snap || {}).serial, r.fault, r.work, r.remarks, r.tripLabel, jobLabel(r.job), r.engineer, ...r.parts.map(p => p.name + ' ' + p.pn)].join(' ').toLowerCase().includes(q)));
}
function reportsListHTML(q, f) {
  const l = reportsMatching(q, f);
  return l.length ? `<div class="group">${l.map(r => reportRow(r)).join('')}</div>` : `<div class="card"><div class="empty">${icon('doc')}${db.reports.length ? 'No report matches.' : 'No service reports yet.<br>Open a trip and tap <b>Submit technical report</b>.'}</div></div>`;
}
function renderReportsList() {
  const v = $('#v-svc'); const f = state.svcF || 'all'; const need = partsToOrder().length;
  v.innerHTML = svcNav('Service reports', `<button class="navbtn circle" id="rl-csv" aria-label="Export CSV">${icon('download')}</button>`) + `<div class="ltitle">Service reports</div><div class="lsub">${db.reports.length} report${db.reports.length === 1 ? '' : 's'}</div>
    ${searchBox('svc-q', 'Search no., client, model, work done…', state.svcQ)}<div class="chips">${[['all', 'All'], ['draft', 'Drafts'], ['final', 'Final']].map(([k, l]) => `<button class="chip ${f === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>
    <div id="svc-list">${reportsListHTML(state.svcQ, f)}</div>
    <div class="group" style="margin-top:18px"><button class="row tap has-icon" id="rl-parts"><span class="ico" style="background:#ff9500">${icon('wrench')}</span><span class="body"><div class="t">Parts to order</div><div class="st">${need ? `${need} part${need === 1 ? '' : 's'} waiting` : 'Nothing waiting'}</div></span>${icon('chevR', 's chev')}</button></div>`;
  $('#svc-back', v).onclick = svcBack; $('#rl-csv', v).onclick = exportReportsCSV; $('#rl-parts', v).onclick = partsSheet;
  const draw = () => { $('#svc-list', v).innerHTML = reportsListHTML(state.svcQ, state.svcF || 'all'); bindSvcRows(v); };
  $('#svc-q', v).oninput = e => { state.svcQ = e.target.value; draw(); };
  $$('[data-f]', v).forEach(c => c.onclick = () => { state.svcF = c.dataset.f; renderReportsList(); });
  bindSvcRows(v);
}
function partsToOrder(all) {
  const out = []; reportsSorted(db.reports).forEach(r => r.parts.forEach(p => { if (p.required && (all || !p.ordered)) out.push({ r, p }); })); return out;
}
function partsText() {
  const l = partsToOrder(); if (!l.length) return '';
  return `Parts to order — ${db.settings.name || 'Field engineer'} (${fmtD(todayISO(), { day: 'numeric', month: 'short', year: 'numeric' })})\n\n` + l.map(({ r, p }) => `• ${p.name}${p.pn ? ' (P/N ' + p.pn + ')' : ''} × ${p.qty} — ${(r.snap || {}).client || ''}, ${(r.snap || {}).model || ''}${(r.snap || {}).serial ? ' SN ' + r.snap.serial : ''} — ${r.no}`).join('\n');
}
function partsSheet() {
  const l = partsToOrder();
  openSheet({ title: 'Parts to order', left: { label: 'Close' }, right: l.length ? { label: 'Share', fn: () => {} } : null,
    body: l.length ? `<div class="group">${l.map(({ r, p }) => `<div class="row"><span class="body"><div class="t">${esc(p.name)} × ${p.qty}</div><div class="st">${esc([p.pn ? 'P/N ' + p.pn : '', (r.snap || {}).client, (r.snap || {}).model, r.no].filter(Boolean).join(' · '))}</div></span><label class="switch sm" title="Mark as ordered"><input type="checkbox" data-ord="${esc(p.id)}"><span></span></label></div>`).join('')}</div><div class="foot">Switch a part on when it has been ordered; it leaves this list.</div>` : `<div class="card"><div class="empty">${icon('check')}No parts waiting to be ordered.</div></div>`,
    onMount: b => {
      $$('[data-ord]', b).forEach(x => x.onchange = () => { const hit = l.find(z => z.p.id === x.dataset.ord); if (hit) { hit.p.ordered = x.checked; save(); setTimeout(partsSheet, 250); } });
      const sp = $('#sheet-primary'); if (sp) sp.onclick = async () => { const txt = partsText(); try { if (navigator.share) await navigator.share({ title: 'Parts to order', text: txt }); else { await navigator.clipboard.writeText(txt); toast('List copied'); } } catch (e) { if (e && e.name !== 'AbortError') { download('parts-to-order.txt', txt, 'text/plain'); } } };
    } });
}
function exportReportsCSV() {
  const list = reportsSorted(db.reports).reverse(); if (!list.length) return toast('No reports to export', 'warn');
  const q = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['Report no.', 'Status', 'Date', 'Time in', 'Time out', 'Client', 'City', 'Country', 'Machine type', 'Model', 'Serial no.', 'Job type', 'Machine status', 'Slice before', 'Slice after', 'Slices since last visit', 'Helium before %', 'Helium after %', 'Fault', 'Work done', 'Remarks', 'Parts', 'Parts to order', 'Engineer', 'Trip', 'Visit no.', 'Department', 'Reported by', 'Warranty', 'Service contract', 'System down', 'Hours down', 'Travel hours', 'Customer contact', 'Customer phone', 'Customer e-mail']];
  for (const r of list) { const s = r.snap || {};
    rows.push([r.no, r.final ? 'Final' : 'Draft', r.date, r.timeIn, r.timeOut, s.client, s.city, s.country, mtype(s.type).label, s.model, s.serial, jobLabel(r.job), mstatus(r.status)[1], r.sliceBefore ?? '', r.sliceAfter ?? '', r.sliceAfter != null && r.sliceBefore != null ? r.sliceAfter - r.sliceBefore : '', r.heliumBefore ?? '', r.heliumAfter ?? '', r.fault, r.work, r.remarks,
      r.parts.map(p => `${p.name}${p.pn ? ' [' + p.pn + ']' : ''} x${p.qty}`).join('; '), r.parts.filter(p => p.required).map(p => `${p.name}${p.pn ? ' [' + p.pn + ']' : ''} x${p.qty}${p.ordered ? ' (ordered)' : ''}`).join('; '), r.engineer, r.tripLabel || '', r.visitNo, r.dept, r.reportedBy, r.warranty, r.contract, r.sysDown, r.downHours, r.travel, s.contact, s.phone, s.email]); }
  download(`veritrip-service-reports-${todayISO()}.csv`, '\ufeff' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
