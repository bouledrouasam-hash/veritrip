  toast('Preparing PDF…'); let blob; try { blob = await buildReportPdf(r); } catch (e) { console.error(e); return toast('Could not build the PDF', 'warn'); }
  const url = URL.createObjectURL(blob); const v = $('#viewer'); document.getElementById('toast').className = '';
  v.innerHTML = `<button class="x" aria-label="Close">${icon('x')}</button><iframe src="${url}" title="${esc(r.no)}"></iframe>`; v.classList.add('show');
  v.querySelector('.x').onclick = () => { v.classList.remove('show'); v.innerHTML = ''; URL.revokeObjectURL(url); };
}

/* ---------------- PWA layer (only in the pwa/ build) ---------------- */
const PWA = (() => {
  const st = { reg: null, waiting: null, deferred: null, updating: false, status: null, persisted: null, lastCheck: Date.now() };
  const supported = 'serviceWorker' in navigator && /^https?:$/.test(location.protocol);
  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const refresh = () => { if ($('#v-settings').classList.contains('active')) renderSettings(); };

  function showUpdate() {
    let b = $('#update-bar');
    if (!b) { b = document.createElement('div'); b.id = 'update-bar'; b.setAttribute('role', 'status'); document.body.appendChild(b); }
    b.innerHTML = `${icon('sparkles', 's')}<span class="body"><b>Update available</b><br><span>A new version of VeriTrip is ready.</span></span><button id="upd-later">Later</button><button id="upd-go" class="prim">Update</button>`;
    $('#upd-later').onclick = () => b.classList.remove('show');
    $('#upd-go').onclick = applyUpdate;
    requestAnimationFrame(() => b.classList.add('show'));
    refresh();
  }
  function applyUpdate() {
    if (!st.waiting) return location.reload();
    st.updating = true; $('#upd-go') && ($('#upd-go').textContent = 'Updating…');
    st.waiting.postMessage({ type: 'SKIP_WAITING' });
    setTimeout(() => location.reload(), 4000); // safety net
  }
  async function check(manual) {
    if (!st.reg) return manual && toast('Offline mode is not available here', 'warn');
    st.lastCheck = Date.now();
    try { await st.reg.update(); } catch (e) { if (manual) toast('Could not check — are you offline?', 'warn'); return; }
    if (manual) setTimeout(() => { if (!st.waiting && !st.reg.installing) toast('VeriTrip is up to date'); }, 1500);
  }
  function askStatus() { navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage({ type: 'STATUS' }); }
  function track(w) {
    if (!w) return;
    w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) { st.waiting = w; showUpdate(); } });
  }
  async function init() {
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); st.deferred = e; refresh(); });
    window.addEventListener('appinstalled', () => { st.deferred = null; toast('VeriTrip installed'); refresh(); });
    if (!supported) return;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (st.updating) location.reload(); else askStatus(); });
    navigator.serviceWorker.addEventListener('message', e => {
      const d = e.data || {};
      if (d.type === 'STATUS') { const first = st.status && !st.status.complete && d.complete; st.status = d; if (first) toast('Ready to work offline'); refresh(); }
      if (d.type === 'READY') { st.status = d; toast('Ready to work offline'); refresh(); }
    });
    try {
      const reg = await navigator.serviceWorker.register('sw.js', { scope: './' }); st.reg = reg;
      if (reg.waiting && navigator.serviceWorker.controller) { st.waiting = reg.waiting; showUpdate(); }
      track(reg.installing);
      reg.addEventListener('updatefound', () => track(reg.installing));
      askStatus();
    } catch (e) { console.warn('VeriTrip: service worker registration failed', e); }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - st.lastCheck > 3600e3) check(false); });
    try { if (navigator.storage && navigator.storage.persisted) { st.persisted = await navigator.storage.persisted(); if (!st.persisted && standalone()) st.persisted = await navigator.storage.persist(); } } catch (e) {}
  }
  function settingsHTML() {
    const s = st.status;
    const off = !supported ? 'Not available (open from a web address)' : !s ? 'Preparing…' : s.complete ? 'Yes — including OCR' : `Downloading… ${s.cached}/${s.total}`;
    let how = '';
    if (!standalone()) how = isIOS() ? 'On iPhone/iPad: open this page in <b>Safari</b>, tap the Share button, then <b>Add to Home Screen</b>.'
      : st.deferred ? '' : 'On Android: open the Chrome menu (⋮) and tap <b>Install app</b> or <b>Add to Home screen</b>.';
    return `<div class="ghead">App</div><div class="group">
      <div class="row"><span class="body">Installed</span><span class="st" style="color:var(--label2)">${standalone() ? 'Yes' : 'No — running in the browser'}</span></div>
      <div class="row"><span class="body">Works offline</span><span class="st" id="s-offline" style="color:var(--label2);text-align:right">${esc(off)}</span></div>
      ${st.deferred ? `<button class="row tap" id="s-install"><span class="body" style="color:var(--blue)">Install VeriTrip on this device</span></button>` : ''}
      ${st.waiting ? `<button class="row tap" id="s-update"><span class="body" style="color:var(--blue)">Update now</span><span class="pill company">New</span></button>`
        : `<button class="row tap" id="s-check"><span class="body" style="color:var(--blue)">Check for updates</span></button>`}
    </div><div class="foot">${how ? how + ' ' : ''}Your trips and receipts are stored on this device only${st.persisted ? ' (protected from automatic clean-up)' : ''} — back up regularly.${s && s.version ? ` Build ${esc(s.version)}.` : ''}</div>`;
  }
  function bindSettings(v) {
    $('#s-install', v) && ($('#s-install', v).onclick = async () => { const e = st.deferred; if (!e) return; st.deferred = null; e.prompt(); try { await e.userChoice; } catch (x) {} refresh(); });
    $('#s-update', v) && ($('#s-update', v).onclick = applyUpdate);
    $('#s-check', v) && ($('#s-check', v).onclick = () => check(true));
  }
  return { init, settingsHTML, bindSettings, check, applyUpdate, state: st, standalone };
})();
window.PWA = PWA;
</script>
</body>
</html>
